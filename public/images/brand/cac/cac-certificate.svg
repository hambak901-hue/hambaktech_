<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <!-- Border & Outer Frame -->
  <rect x="20" y="20" width="760" height="1060" fill="#FAFAF9" stroke="#16A34A" stroke-width="8" rx="8" />
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Coat of Arms Placeholder / Crest Header -->
  <circle cx="400" cy="120" r="45" fill="#15803D" opacity="0.1" />
  <text x="400" y="115" text-anchor="middle" font-family="serif" font-size="16" font-weight="700" fill="#166534" letter-spacing="1">FEDERAL REPUBLIC OF NIGERIA</text>
  <text x="400" y="140" text-anchor="middle" font-family="serif" font-size="14" font-weight="600" fill="#15803D">CORPORATE AFFAIRS COMMISSION</text>

  <!-- Title -->
  <text x="400" y="220" text-anchor="middle" font-family="serif" font-size="26" font-weight="900" fill="#0F172A" letter-spacing="1.5">CERTIFICATE OF REGISTRATION</text>
  <text x="400" y="255" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155">BUSINESS NAME REGISTRATION NO. 9284726</text>

  <!-- Body Content -->
  <text x="400" y="320" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" fill="#475569">The Registrar-General of Corporate Affairs Commission hereby certifies that</text>

  <!-- Entity Name -->
  <rect x="150" y="350" width="500" height="50" rx="4" fill="#DC2626" opacity="0.08" />
  <text x="400" y="384" text-anchor="middle" font-family="serif" font-size="24" font-weight="900" fill="#DC2626" letter-spacing="1">HAMBAK TECH &amp; SERVICES</text>

  <text x="400" y="440" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" fill="#475569">is this day registered as a business name under the</text>
  <text x="400" y="470" text-anchor="middle" font-family="serif" font-size="16" font-weight="700" fill="#0F172A">COMPANIES AND ALLIED MATTERS ACT 2020</text>

  <!-- Business Particulars Box -->
  <rect x="100" y="520" width="600" height="240" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />

  <text x="140" y="565" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748B">GENERAL NATURE OF BUSINESS:</text>
  <text x="140" y="595" font-family="sans-serif" font-size="16" font-weight="800" fill="#0F172A">INFORMATION SERVICE ACTIVITIES</text>

  <text x="140" y="650" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748B">PRINCIPAL PLACE OF BUSINESS:</text>
  <text x="140" y="680" font-family="sans-serif" font-size="15" font-weight="700" fill="#0F172A">N/A, Origanrigan cele Area, Lagos , LAGOS STATE, NIGERIA</text>

  <text x="140" y="725" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748B">TAX IDENTIFICATION NUMBER (TIN):</text>
  <text x="400" y="725" font-family="monospace" font-size="15" font-weight="800" fill="#047857">2622495414483</text>

  <!-- Attestation -->
  <text x="400" y="810" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#475569">Given under my hand at Abuja this 5th day of February, 2026</text>

  <!-- Seal and Signatures -->
  <circle cx="400" cy="890" r="40" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2" />
  <text x="400" y="895" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#047857">CAC OFFICIAL SEAL</text>

  <line x1="500" y1="960" x2="700" y2="960" stroke="#0F172A" stroke-width="1.5" />
  <text x="600" y="980" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Hussaini Ishaq Magaji SAN</text>
  <text x="600" y="1000" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">Registrar - General</text>

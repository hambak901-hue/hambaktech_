<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <mask id="fav-gaps">
      <rect width="128" height="128" fill="#FFFFFF" />
      <rect x="0" y="59" width="128" height="10" fill="#000000" />
      <rect x="59" y="0" width="10" height="128" fill="#000000" />
    </mask>
  </defs>

  <!-- Circular background for crisp visibility on browser tabs -->
  <circle cx="64" cy="64" r="62" fill="#FFFFFF" />

  <!-- 4-Quadrant Outer Segmented Ring in Terracotta -->
  <path
    d="M 64 8 A 56 56 0 1 0 64 120 A 56 56 0 1 0 64 8 Z M 64 28 A 36 36 0 1 1 64 100 A 36 36 0 1 1 64 28 Z"
    fill="#C85A17"
    fill-rule="evenodd"
    mask="url(#fav-gaps)"
  />

  <!-- Central H Monogram -->
  <g>
    <rect x="42" y="28" width="15" height="72" rx="1.5" fill="#C85A17" />
    <rect x="56" y="54" width="16" height="20" fill="#C85A17" />
  </g>

  <!-- Central B Monogram with dual loops -->
  <g>
    <path
      d="M 66 28
         H 78
         C 90 28, 98 35, 98 46
         C 98 54, 93 60, 85 63
         C 95 65, 100 73, 100 84
         C 100 96, 91 100, 77 100
         H 66
         Z"
      fill="#F5B242"
    />
    <!-- Counters -->
    <path d="M 75 38 H 78 C 84 38, 88 41, 88 46 C 88 51, 84 54, 78 54 H 75 Z" fill="#FFFFFF" />
    <path d="M 75 74 H 78 C 85 74, 89 77, 89 83 C 89 89, 85 92, 77 92 H 75 Z" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- 4-Quadrant Ring Gaps -->
    <mask id="logo-light-quadrant-gaps">
      <rect width="500" height="560" fill="#FFFFFF" />
      <rect x="0" y="174" width="500" height="26" fill="#000000" />
      <rect x="237" y="0" width="26" height="560" fill="#000000" />
    </mask>

    <linearGradient id="b-lobe-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9CE78" />
      <stop offset="100%" stop-color="#EEA738" />
    </linearGradient>
    <linearGradient id="b-bevel-light-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA771D" />
      <stop offset="100%" stop-color="#A5580C" />
    </linearGradient>
  </defs>

  <!-- Segmented Outer Ring in Terracotta -->
  <path
    d="M 250 35 A 150 150 0 1 0 250 335 A 150 150 0 1 0 250 35 Z M 250 90 A 95 95 0 1 1 250 280 A 95 95 0 1 1 250 90 Z"
    fill="#C85A17"
    fill-rule="evenodd"
    mask="url(#logo-light-quadrant-gaps)"
  />

  <!-- Monogram: H -->
  <g id="monogram-h-light">
    <rect x="190" y="88" width="40" height="195" rx="2" fill="#C85A17" />
    <rect x="228" y="160" width="42" height="50" fill="#C85A17" />
    <rect x="226" y="88" width="4" height="195" fill="#A8450E" opacity="0.3" />
  </g>

  <!-- Monogram: B with 3D bevel depth -->
  <g id="monogram-b-light">
    <path
      d="M 256 92 H 292 C 324 92, 344 110, 344 138 C 344 158, 332 174, 312 181 C 336 187, 350 206, 350 234 C 350 266, 326 285, 288 285 H 256 Z"
      fill="url(#b-bevel-light-grad)"
      transform="translate(4, 4)"
    />
    <path
      d="M 256 90 H 290 C 322 90, 342 108, 342 136 C 342 156, 330 172, 310 179 C 334 185, 348 204, 348 232 C 348 264, 324 283, 286 283 H 256 Z"
      fill="url(#b-lobe-light)"
    />
    <path d="M 280 116 H 288 C 306 116, 316 124, 316 136 C 316 148, 306 156, 288 156 H 280 Z" fill="#FFFFFF" />
    <path d="M 280 216 H 288 C 308 216, 320 225, 320 238 C 320 251, 308 260, 288 260 H 280 Z" fill="#FFFFFF" />
    <path d="M 256 90 C 280 90, 306 97, 322 111 C 310 102, 286 95, 256 95 Z" fill="#FFF2D1" opacity="0.8" />
  </g>

  <!-- Typography: HAMBAK -->
  <text
    x="250"
    y="420"
    text-anchor="middle"
    font-family="'Cooper Black', 'Rockwell Extra Bold', 'Clarendon', Georgia, serif"
    font-size="64"
    font-weight="900"
    letter-spacing="2"
    fill="#0B0F19"
  >HAMBAK</text>

  <!-- Typography: Tech & Services -->
  <text
    x="250"
    y="485"
    text-anchor="middle"
    font-family="'Cooper Black', 'Rockwell', Georgia, serif"
    font-size="44"
    font-weight="800"
    letter-spacing="0.5"
    fill="#0B0F19"
  >Tech &amp; Services</text>
</svg>

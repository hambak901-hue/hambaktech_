<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Gaps cutting the ring into 4 distinct quadrants -->
    <mask id="hambak-ring-gaps-dark">
      <rect width="500" height="560" fill="#FFFFFF" />
      <!-- Horizontal gap -->
      <rect x="0" y="174" width="500" height="26" fill="#000000" />
      <!-- Vertical gap -->
      <rect x="237" y="0" width="26" height="560" fill="#000000" />
    </mask>

    <linearGradient id="b-face-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCDA8B" />
      <stop offset="100%" stop-color="#F5B242" />
    </linearGradient>
    <linearGradient id="b-bevel-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE8322" />
      <stop offset="100%" stop-color="#B85F0A" />
    </linearGradient>
  </defs>

  <!-- 4-Quadrant Outer Segmented Ring in Terracotta -->
  <path
    d="M 250 35 A 150 150 0 1 0 250 335 A 150 150 0 1 0 250 35 Z M 250 90 A 95 95 0 1 1 250 280 A 95 95 0 1 1 250 90 Z"
    fill="#E46E28"
    fill-rule="evenodd"
    mask="url(#hambak-ring-gaps-dark)"
  />

  <!-- Central Monogram: Left 'H' in Solid Terracotta -->
  <g id="logo-h-dark">
    <rect x="190" y="88" width="40" height="195" rx="2" fill="#E46E28" />
    <rect x="228" y="160" width="42" height="50" fill="#E46E28" />
    <rect x="226" y="88" width="4" height="195" fill="#A8450E" opacity="0.4" />
  </g>

  <!-- Central Monogram: Right 'B' in Golden Amber with 3D depth -->
  <g id="logo-b-dark">
    <!-- 3D extruded shadow/bevel -->
    <path
      d="M 256 92
         H 292
         C 324 92, 344 110, 344 138
         C 344 158, 332 174, 312 181
         C 336 187, 350 206, 350 234
         C 350 266, 326 285, 288 285
         H 256
         Z"
      fill="url(#b-bevel-dark)"
      transform="translate(4, 4)"
    />

    <!-- Main Front Face of B -->
    <path
      d="M 256 90
         H 290
         C 322 90, 342 108, 342 136
         C 342 156, 330 172, 310 179
         C 334 185, 348 204, 348 232
         C 348 264, 324 283, 286 283
         H 256
         Z"
      fill="url(#b-face-dark)"
    />

    <!-- Top inner counter hole of B (dark background aware) -->
    <path
      d="M 280 116
         H 288
         C 306 116, 316 124, 316 136
         C 316 148, 306 156, 288 156
         H 280
         Z"
      fill="#121824"
    />

    <!-- Bottom inner counter hole of B -->
    <path
      d="M 280 216
         H 288
         C 308 216, 320 225, 320 238
         C 320 251, 308 260, 288 260
         H 280
         Z"
      fill="#121824"
    />

    <!-- Highlight sheen -->
    <path
      d="M 256 90 C 280 90, 306 97, 322 111 C 310 102, 286 95, 256 95 Z"
      fill="#FFF9E6"
      opacity="0.9"
    />
  </g>

  <!-- Typography: HAMBAK in Crisp White -->
  <text
    x="250"
    y="420"
    text-anchor="middle"
    font-family="'Cooper Black', 'Rockwell Extra Bold', 'Clarendon', Georgia, serif"
    font-size="64"
    font-weight="900"
    letter-spacing="2"
    fill="#FFFFFF"
  >HAMBAK</text>

  <!-- Typography: Tech & Services in Crisp White -->
  <text
    x="250"
    y="485"
    text-anchor="middle"
    font-family="'Cooper Black', 'Rockwell', Georgia, serif"
    font-size="44"
    font-weight="800"
    letter-spacing="0.5"
    fill="#F8FAFC"
  >Tech &amp; Services</text>
</svg>

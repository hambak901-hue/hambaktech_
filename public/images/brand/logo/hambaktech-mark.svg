<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <mask id="ring-gaps">
      <rect width="300" height="300" fill="#FFFFFF" />
      <!-- Horizontal cross-cutout separating top and bottom arcs -->
      <rect x="0" y="137" width="300" height="26" fill="#000000" />
      <!-- Vertical cross-cutout separating left and right arcs -->
      <rect x="137" y="0" width="26" height="300" fill="#000000" />
    </mask>
  </defs>

  <!-- Segmented Outer Ring -->
  <path
    d="M 150 20 A 130 130 0 1 0 150 280 A 130 130 0 1 0 150 20 Z M 150 68 A 82 82 0 1 1 150 232 A 82 82 0 1 1 150 68 Z"
    fill="#C96022"
    fill-rule="evenodd"
    mask="url(#ring-gaps)"
  />

  <!-- Central Monogram: Left 'H' Stem & Crossbar in Terracotta -->
  <g id="monogram-h">
    <!-- Main vertical bar of H -->
    <rect x="98" y="74" width="34" height="152" rx="2" fill="#C96022" />
    <!-- Horizontal connecting bar extending to the B -->
    <rect x="128" y="127" width="36" height="42" fill="#C96022" />
    <!-- Subtle dimensional shadow tone on H stem edge -->
    <rect x="128" y="74" width="4" height="152" fill="#A84814" opacity="0.4" />
  </g>

  <!-- Central Monogram: Right 'B' Dual Lobes in Warm Amber -->
  <g id="monogram-b">
    <!-- Dimensional back-edge for B -->
    <path
      d="M 148 76 L 156 76 L 156 224 L 148 224 Z"
      fill="#D68928"
    />
    <!-- Outer B silhouette with dual lobes -->
    <path
      d="M 154 74
         H 178
         C 198 74, 212 87, 212 107
         C 212 124, 202 137, 186 142
         C 205 147, 216 161, 216 181
         C 216 205, 199 224, 175 224
         H 154
         Z"
      fill="#F5B050"
    />
    <!-- Top inner counter / cutout -->
    <path
      d="M 172 95
         H 177
         C 188 95, 194 101, 194 110
         C 194 119, 187 125, 176 125
         H 172
         Z"
      fill="#FFFFFF"
    />
    <!-- Bottom inner counter / cutout -->
    <path
      d="M 172 173
         H 177
         C 190 173, 197 180, 197 190
         C 197 201, 189 207, 176 207
         H 172
         Z"
      fill="#FFFFFF"
    />
    <!-- Golden amber depth highlight on top lobe -->
    <path
      d="M 154 74 C 172 74, 192 80, 200 92 C 194 83, 178 77, 154 77 Z"
      fill="#FCE0A6"
      opacity="0.7"
    />
  </g>
</svg>

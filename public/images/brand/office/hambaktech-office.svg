<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Background: Office Interior Canvas -->
  <defs>
    <linearGradient id="office-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E9EE" />
      <stop offset="60%" stop-color="#DEE3E9" />
      <stop offset="100%" stop-color="#C5CBD3" />
    </linearGradient>
    <linearGradient id="signboard-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F3B82" />
      <stop offset="50%" stop-color="#1A56B5" />
      <stop offset="100%" stop-color="#0F3B82" />
    </linearGradient>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2B8A3" />
      <stop offset="100%" stop-color="#B2A68F" />
    </linearGradient>
  </defs>

  <!-- Floor Tiling -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#tile-grad)" />
  <!-- Tile Grid Lines -->
  <path d="M 0 520 L 1200 520 M 0 600 L 1200 600 M 0 690 L 1200 690 M 150 520 L 50 800 M 350 520 L 300 800 M 600 520 L 600 800 M 850 520 L 900 800 M 1050 520 L 1150 800" stroke="#9E927A" stroke-width="2" opacity="0.6" />

  <!-- Back Wall -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#office-wall)" />

  <!-- Overhead Main Signboard -->
  <g id="main-signboard">
    <rect x="180" y="30" width="840" height="130" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.15))" />
    <rect x="190" y="40" width="820" height="110" rx="4" fill="url(#signboard-grad)" />
    <!-- Yellow Signboard Accent Bar -->
    <path d="M 190 135 L 1010 135 L 1010 150 L 190 150 Z" fill="#FACC15" opacity="0.9" />
    <!-- Signboard Heading -->
    <text x="600" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#FACC15" letter-spacing="2">HAMBAK TECH &amp; SERVICES</text>
    <text x="600" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="3">BUSINESS CENTER | GAME CENTER | COMPUTER INSTITUTE</text>
  </g>

  <!-- Left Wall Section: Business Center Banner -->
  <g id="business-center-section">
    <rect x="90" y="195" width="220" height="280" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <rect x="90" y="195" width="220" height="42" fill="#0369A1" />
    <text x="200" y="223" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">BUSINESS CENTER</text>
    <!-- Bullet points matching physical wall banner -->
    <g font-family="sans-serif" font-size="13" font-weight="600" fill="#1E293B">
      <circle cx="115" cy="260" r="7" fill="#10B981" />
      <text x="130" y="265">Photocopy</text>
      <circle cx="115" cy="295" r="7" fill="#10B981" />
      <text x="130" y="300">Printing Press</text>
      <circle cx="115" cy="330" r="7" fill="#0EA5E9" />
      <text x="130" y="335">NIN Online Code</text>
      <circle cx="115" cy="365" r="7" fill="#EF4444" />
      <text x="130" y="370">Online Registration</text>
      <circle cx="115" cy="400" r="7" fill="#3B82F6" />
      <text x="130" y="405">Typing Services</text>
      <circle cx="115" cy="435" r="7" fill="#F59E0B" />
      <text x="130" y="440">Passport Photos</text>
    </g>
    <!-- Service Desk & Equipment -->
    <rect x="70" y="475" width="260" height="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" rx="2" />
    <rect x="110" y="435" width="70" height="40" rx="3" fill="#1E293B" />
    <text x="145" y="460" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">PRINTER</text>
  </g>

  <!-- Center Wall Section: Game Center -->
  <g id="game-center-section">
    <rect x="520" y="195" width="160" height="34" rx="3" fill="#0F3B82" />
    <text x="600" y="218" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1">GAME CENTER</text>
    <!-- FIFA 23 Main Display Screen -->
    <rect x="490" y="240" width="220" height="125" rx="4" fill="#090D16" stroke="#475569" stroke-width="4" />
    <rect x="500" y="250" width="200" height="105" fill="#1E3A8A" />
    <text x="600" y="305" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="900" fill="#FACC15" letter-spacing="2">FIFA 23</text>
    <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PS CONSOLE ARENA</text>
    <!-- Console Station Desk -->
    <rect x="470" y="480" width="260" height="85" rx="3" fill="#B45309" stroke="#78350F" stroke-width="2" />
    <rect x="490" y="500" width="90" height="45" rx="2" fill="#D97706" />
    <rect x="620" y="500" width="90" height="45" rx="2" fill="#D97706" />
  </g>

  <!-- Right Wall Section: Computer Institute -->
  <g id="computer-institute-section">
    <rect x="880" y="195" width="230" height="280" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" />
    <rect x="880" y="195" width="230" height="42" fill="#1E40AF" />
    <text x="995" y="223" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">COMPUTER INSTITUTE</text>
    <text x="995" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#1D4ED8">LEARN COMPUTER HERE!</text>
    <g font-family="sans-serif" font-size="12" font-weight="600" fill="#1E293B">
      <circle cx="910" cy="285" r="5" fill="#2563EB" />
      <text x="925" y="289">Basic Computer</text>
      <circle cx="910" cy="315" r="5" fill="#2563EB" />
      <text x="925" y="319">Excel Fundamentals</text>
      <circle cx="910" cy="345" r="5" fill="#2563EB" />
      <text x="925" y="349">CorelDraw Graphics</text>
      <circle cx="910" cy="375" r="5" fill="#2563EB" />
      <text x="925" y="379">Typing &amp; Tallying</text>
      <circle cx="910" cy="405" r="5" fill="#2563EB" />
      <text x="925" y="409">Internet Training</text>
    </g>
    <!-- Workstation Bench with Monitors -->
    <rect x="840" y="480" width="290" height="85" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2" rx="2" />
    <rect x="860" y="440" width="55" height="40" rx="2" fill="#111827" stroke="#4B5563" />
    <rect x="940" y="440" width="55" height="40" rx="2" fill="#111827" stroke="#4B5563" />
    <rect x="1020" y="440" width="55" height="40" rx="2" fill="#111827" stroke="#4B5563" />
    <!-- Student Workstation Chairs -->
    <circle cx="887" cy="590" r="16" fill="#047857" />
    <circle cx="967" cy="590" r="16" fill="#047857" />
    <circle cx="1047" cy="590" r="16" fill="#047857" />
  </g>

  <!-- Verified Location Tag -->
  <rect x="360" y="740" width="480" height="42" rx="21" fill="#0F172A" opacity="0.9" />
  <text x="600" y="766" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">
    Official Physical Premises — Origanrigan cele Area, Lagos, Nigeria
  </text>
</svg>

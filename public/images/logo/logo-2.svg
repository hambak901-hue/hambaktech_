<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <mask id="hambak-h-gaps-light">
      <rect width="50" height="50" fill="#FFFFFF" />
      <rect x="0" y="23" width="50" height="4" fill="#000000" />
      <rect x="23" y="0" width="4" height="50" fill="#000000" />
    </mask>

    <linearGradient id="b-grad-h-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9CE78" />
      <stop offset="100%" stop-color="#EEA738" />
    </linearGradient>
  </defs>

  <!-- Left: Official Circular Emblem -->
  <g transform="translate(4, 2)">
    <!-- 4-Quadrant Ring -->
    <path
      d="M 23 4 A 19 19 0 1 0 23 42 A 19 19 0 1 0 23 4 Z M 23 11 A 12 12 0 1 1 23 35 A 12 12 0 1 1 23 11 Z"
      fill="#C85A17"
      fill-rule="evenodd"
      mask="url(#hambak-h-gaps-light)"
    />

    <!-- Monogram H -->
    <rect x="15" y="11" width="5" height="24" rx="0.5" fill="#C85A17" />
    <rect x="20" y="20" width="5" height="6" fill="#C85A17" />

    <!-- Monogram B -->
    <path
      d="M 24 11
         H 28
         C 32 11, 35 13, 35 17
         C 35 19.5, 33 21, 31 22
         C 34 23, 36 25, 36 29
         C 36 33, 33 35, 28 35
         H 24
         Z"
      fill="url(#b-grad-h-light)"
    />
    <path d="M 27 14 H 28 C 30 14, 32 15, 32 17 C 32 19, 30 20, 28 20 H 27 Z" fill="#FFFFFF" />
    <path d="M 27 26 H 28 C 30 26, 32 27, 32 29 C 32 31, 30 32, 28 32 H 27 Z" fill="#FFFFFF" />
  </g>

  <!-- Right: Official Typography in Dark Slate -->
  <text
    x="58"
    y="25"
    font-family="'Cooper Black', 'Rockwell Extra Bold', 'Clarendon', Georgia, serif"
    font-size="18"
    font-weight="900"
    letter-spacing="0.8"
    fill="#0B0F19"
  >HAMBAK</text>

  <text
    x="59"
    y="40"
    font-family="'Cooper Black', 'Rockwell', Georgia, serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.2"
    fill="#C85A17"
  >Tech &amp; Services</text>
</svg>
